[project]
name = "evaluation-scripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "nicegui>=3.15.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "rasterio>=1.5.0",
    "qdrant-client>=1.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pyproj>=3.6",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require a running Qdrant service with data (deselect with '-k \"not integration\"')",
]
